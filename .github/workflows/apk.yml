name: Build APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          packages: "platforms;android-37.0 build-tools;37.0.0 platform-tools"

      - name: Install NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --install "ndk;30.0.16248370"
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Build hev tunnel libraries
        run: NDK_DEBUG=0 bash compile-hevtun.sh

      - name: Copy hev libraries
        run: cp -a libs V2rayNG/app/

      - name: Download libv2ray
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -C AndroidLibXrayLite fetch --tags --force
          TAG="$(git -C AndroidLibXrayLite describe --tags --abbrev=0 || echo v26.10.31)"
          echo "libv2ray tag: $TAG"
          mkdir -p V2rayNG/app/libs
          OUT="V2rayNG/app/libs/libv2ray.aar"
          download() {
            local tag="$1"
            rm -f "$OUT"
            if gh release download "$tag" -R 2dust/AndroidLibXrayLite -p 'libv2ray.aar' -D V2rayNG/app/libs; then
              return 0
            fi
            ASSET_ID="$(gh api "repos/2dust/AndroidLibXrayLite/releases/tags/${tag}"               --jq '.assets[] | select(.name=="libv2ray.aar") | .id')"
            if [ -n "${ASSET_ID}" ]; then
              gh api -H "Accept: application/octet-stream"                 "/repos/2dust/AndroidLibXrayLite/releases/assets/${ASSET_ID}" > "$OUT"
              return 0
            fi
            curl -fL --retry 10 --retry-all-errors --retry-delay 8               --connect-timeout 30 --max-time 300               -o "$OUT"               "https://github.com/2dust/AndroidLibXrayLite/releases/download/${tag}/libv2ray.aar"
          }
          if ! download "$TAG"; then
            echo "Primary tag failed; trying previous release tags"
            for tag in $(gh api repos/2dust/AndroidLibXrayLite/releases --jq '.[].tag_name' | head -5); do
              echo "Trying $tag"
              download "$tag" && TAG="$tag" && break
            done
          fi
          test -s "$OUT"
          echo "Downloaded $(wc -c < "$OUT") bytes for $TAG"
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Prefer Gradle mirror when services.gradle.org is down
        run: |
          # services.gradle.org currently redirects to github.com/gradle releases and can 504.
          sed -i 's#https\\://services.gradle.org/distributions/gradle-9.8.2-bin.zip#https\\://mirrors.cloud.tencent.com/gradle/gradle-9.8.2-bin.zip#' \
            V2rayNG/gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl V2rayNG/gradle/wrapper/gradle-wrapper.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: V2rayNG
        env:
          STORE_B64: ${{ secrets.APP_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.APP_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.APP_KEY_PASSWORD }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod 755 gradlew
          if [ -n "$STORE_B64" ] && [ -n "$STORE_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            echo "$STORE_B64" | base64 -d > "$RUNNER_TEMP/mbv2ray-release.p12"
            ./gradlew assemblePlaystoreRelease --stacktrace \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/mbv2ray-release.p12" \
              -Pandroid.injected.signing.store.password="$STORE_PASS" \
              -Pandroid.injected.signing.store.type=pkcs12 \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASS"
            echo "SIGNED_RELEASE=1" >> "$GITHUB_ENV"
            echo "APK_GLOB=V2rayNG/app/build/outputs/apk/playstore/release/*universal*.apk" >> "$GITHUB_ENV"
          else
            echo "Release signing secrets missing; building Playstore debug APK for artifacts only."
            ./gradlew assemblePlaystoreDebug --stacktrace
            echo "SIGNED_RELEASE=0" >> "$GITHUB_ENV"
            echo "APK_GLOB=V2rayNG/app/build/outputs/apk/playstore/debug/*universal*.apk" >> "$GITHUB_ENV"
          fi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mbv2ray-universal
          path: ${{ env.APK_GLOB }}
          if-no-files-found: error

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' V2rayNG/app/build.gradle.kts | head -1)"
          NOTES_FILE="release-notes.txt"
          if [ ! -f "$NOTES_FILE" ]; then
            printf 'mbv2ray %s\n' "$VER" > "$NOTES_FILE"
          fi
          if [ "${SIGNED_RELEASE:-0}" != "1" ]; then
            echo "WARNING: publishing Playstore debug APK because release signing secrets are missing."
            echo "Configure APP_KEYSTORE_* secrets for production-signed self-updates."
            printf '\n\nNote: this build is unsigned/debug-signed. Install over a differently signed build may fail.\n' >> "$NOTES_FILE"
          fi
          APK="$(ls $APK_GLOB)"
          if gh release view "v$VER" >/dev/null 2>&1; then
            gh release upload "v$VER" "$APK" --clobber
            gh release edit "v$VER" --title "mbv2ray $VER" --notes-file "$NOTES_FILE"
          else
            gh release create "v$VER" "$APK" \
              --title "mbv2ray $VER" \
              --notes-file "$NOTES_FILE"
          fi
          gh release delete apk --yes --cleanup-tag || true
